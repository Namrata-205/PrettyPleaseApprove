groups:
  - name: pr_review_bot
    rules:
      - alert: BotBackendDown
        expr: up{job="bot-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bot backend is unreachable"
          description: "prettypleaseapprove bot backend has been down for more than 1 minute."

      - alert: HighReviewLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="bot-backend"}[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PR review taking too long"
          description: "95th percentile review latency is above 30 seconds."

      - alert: WebhookErrorRate
        expr: rate(http_requests_total{job="bot-backend", status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High webhook error rate"
          description: "More than 5% of webhook requests are returning 5xx errors."

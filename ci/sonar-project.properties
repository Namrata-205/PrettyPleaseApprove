# ============================================================
# SonarQube project configuration for prettypleaseapprove
#
# NOTE: sonar.projectKey and sonar.projectName are intentionally
# NOT set here. They are injected at runtime by the Jenkinsfile
# using the repo name (e.g. "acme-org/payments-api" becomes
# "acme-org-payments-api"), ensuring each consumer repo gets
# its own isolated SonarQube project.
#
# If you want to override the key for this specific repo,
# uncomment and set:
#   sonar.projectKey=my-custom-key
#   sonar.projectName=My Project Name
# ============================================================

# ── Source roots ─────────────────────────────────────────────
# These defaults work for Python projects. Override per-repo as needed.
sonar.sources=.
sonar.exclusions=\
    **/node_modules/**,\
    **/__pycache__/**,\
    **/*.pyc,\
    **/migrations/**,\
    **/alembic/**,\
    infra/**,\
    monitoring/**,\
    .venv/**,\
    **/dist/**,\
    **/build/**,\
    **/*.min.js

# ── Language / encoding ──────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Python-specific settings ─────────────────────────────────
# Uncomment if your repo generates a coverage XML report:
# sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11

# ── Pull Request decoration ───────────────────────────────────
# Injected at runtime by Jenkinsfile — do NOT set here:
#   sonar.pullrequest.key
#   sonar.pullrequest.branch
#   sonar.pullrequest.base

# ── SCM ──────────────────────────────────────────────────────
sonar.scm.provider=git

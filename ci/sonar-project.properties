# ============================================================
# SonarQube project configuration for prettypleaseapprove
# ============================================================

# ── Project identity ─────────────────────────────────────────
sonar.projectKey=pr-review-bot
sonar.projectName=prettypleaseapprove PR Review Bot
sonar.projectVersion=1.0

# ── Source roots ─────────────────────────────────────────────
# Scan the backend Python source; skip tests from main analysis
sonar.sources=backend/app
sonar.tests=backend/tests
sonar.exclusions=\
    **/node_modules/**,\
    **/__pycache__/**,\
    **/*.pyc,\
    **/migrations/**,\
    **/alembic/**,\
    infra/**,\
    monitoring/**,\
    .venv/**

# ── Language / encoding ──────────────────────────────────────
sonar.language=py
sonar.sourceEncoding=UTF-8

# ── Python-specific settings ─────────────────────────────────
# Paths to coverage XML (generated by pytest-cov)
sonar.python.coverage.reportPaths=backend/coverage.xml
# Paths to pylint/ruff reports (optional — remove if not used)
# sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.version=3.11

# ── Quality Gate thresholds (enforced by gate on SonarQube UI)─
# These are informational comments; actual thresholds live in
# the SonarQube quality gate named "prettypleaseapprove-gate"
# new_coverage >= 80%
# new_duplicated_lines_density <= 5%
# new_blocker_violations = 0
# new_critical_violations = 0

# ── Pull Request decoration ───────────────────────────────────
# These are injected at runtime by Jenkinsfile (PR-specific):
#   sonar.pullrequest.key
#   sonar.pullrequest.branch
#   sonar.pullrequest.base
# Do NOT hardcode them here.

# ── SCM / blame ──────────────────────────────────────────────
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

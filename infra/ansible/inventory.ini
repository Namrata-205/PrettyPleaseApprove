# ============================================================
# Ansible inventory for prettypleaseapprove
# Fill in IPs from `terraform output ansible_inventory_hint`
# ============================================================

[jenkins]
jenkins-host ansible_host=JENKINS_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[sonarqube]
sonarqube-host ansible_host=SONARQUBE_PRIVATE_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[bot_backend]
bot-backend-host ansible_host=BOT_BACKEND_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

# ── Group variables ───────────────────────────────────────────
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
